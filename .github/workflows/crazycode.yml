name: crazycode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  crazycode:
    if: |
      contains(github.event.comment.body, ' /crazy') ||
      startsWith(github.event.comment.body, '/crazy') ||
      contains(github.event.comment.body, ' /crazycode') ||
      startsWith(github.event.comment.body, '/crazycode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run crazycode
        uses: ./github
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: opencode/claude-opus-4-5
